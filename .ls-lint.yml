# File and folder naming rules, checked with ls-lint (npm run lint:names).
# Names use lowercase words joined by hyphens, then an optional dotted suffix
# such as ".page", ".api", ".locators", or ".cy" (for example "login.page.ts").

ls:
  .ts: regex:^[a-z0-9]+(-[a-z0-9]+)*(\.[a-z0-9]+(-[a-z0-9]+)*)*$
  .mjs: regex:^[a-z0-9]+(-[a-z0-9]+)*$
  .json: regex:^[a-z0-9]+(-[a-z0-9]+)*$

ignore:
  - node_modules
  - reports
  - coverage
  - .git
  - .github
  - .vscode
